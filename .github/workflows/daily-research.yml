name: daily-cto-intelligence
on:
  workflow_dispatch:
  # Scheduled run disabled: opencode contributor-free rejects service-account keys in CI
  # (Error: Reconnect OpenCode Console). Generation runs on Windows Task Scheduler instead.
  # schedule:
  #   - cron: "30 2 * * *"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: npm install --global @opencode/cli

      - name: Run CTO research
        run: |
          TODAY=$(date +%F)
          echo "opencode version:"
          opencode --version || true
          echo "auth status (do not print secrets):"
          opencode auth list || true
          set +e
          opencode run --standalone --agent cto-research --model opencode/muse-spark-1.3-contributor-free "Run today's CTO intelligence research for $TODAY. Read reports/index.md and the 2-3 most recent reports/daily/*.md first to avoid duplication. Save full report to reports/daily/$TODAY.md and update reports/index.md." > /tmp/research-output.txt 2>&1
          CODE=$?
          echo "opencode exit code: $CODE"
          cat /tmp/research-output.txt
          exit $CODE
        env:
          # Get from https://opencode.ai/console -> API Keys (Zen).
          # Required in CI for opencode Zen free models. Add as repo secret OPENCODE_API_KEY.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Commit report
        run: |
          git config user.name "cto-bot"
          git config user.email "cto-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "CTO intelligence $(date +%F)"
          git push

      - name: Send Telegram briefing
        if: success()
        run: python scripts/send_telegram.py --report reports/daily/$(date +%F).md
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
